
name: ChurnGuard - Predict changed datasets

on:
  push:
    branches:
      - main
    paths:
      - 'Capstone_Project_CustomerChurn/data/**/*.csv'
      - 'Capstone_Project_CustomerChurn/data/**/*.xlsx'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: churnguard-prediction
  cancel-in-progress: false

jobs:
  score:
    name: Automated Churn Prediction
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Capstone_Project_CustomerChurn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Capstone_Project_CustomerChurn/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify model files
        run: |
          test -f models/churnguard_xgboost.joblib
          test -f models/feature_schema.json
          test -f scripts/predict_changed.py
          echo "ChurnGuard model and script files verified."

      - name: Run automated churn predictions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/predict_changed.py --all
          else
            python scripts/predict_changed.py
          fi

      - name: Upload prediction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churnguard-predictions-${{ github.run_id }}
          path: Capstone_Project_CustomerChurn/outputs/automation/
          if-no-files-found: warn
          retention-days: 30
