name: CI-CD Wellness Tourism Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-train-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run data prep
      run: python src/data_prep.py

    - name: Train model
      run: python src/train_model.py

    - name: Read model filename and repo
      id: modelinfo
      run: |
        echo "MODEL_FILENAME=$(cat model_output.txt)" >> $GITHUB_ENV
        echo "MODEL_REPO=$(cat model_repo.txt)" >> $GITHUB_ENV

    - name: Deploy FastAPI Space
      uses: huggingface/space-deploy-action@v1
      with:
        repo-id: Omotayof/wellness-tourism-api
        token: ${{ secrets.HF_TOKEN_ML }}
        space-variables: |
          MODEL_REPO=${{ env.HF_MODEL_REPO }}
          MODEL_FILENAME=${{ env.MODEL_FILENAME }}
